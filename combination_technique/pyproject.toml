[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combination-technique"
version = "0.1.0"
description = "Sparse grid combination technique solvers for high-dimensional linear PDEs."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["combination_technique*"]

